{{- $related := .Site.RegularPages.Related . | first 5 -}}
{{- if gt (len $related) 0 -}}
<section class="related-posts">
  <h2>{{ i18n "related_posts" | default "Posts Relacionados" }}</h2>
  <ul class="related-posts-list">
    {{- range $related }}
    <li class="related-post-item">
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
    {{- end }}
  </ul>
</section>
{{- end -}}
