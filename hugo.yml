  title: "Dirlei Friedrich"
  description: "Desenvolvedor focado em ERP Protheus, Engenharia de Dados e Backend."
  keywords:
    - Protheus
    - ERP
    - Engenharia de Dados
    - PostgreSQL
    - Backend
    - APIs
    - SQL
  author: "Dirlei Friedrich"
  DateFormat: "02/01/2006"
  defaultTheme: light
  disableThemeToggle: true
  label:
    text: "Home"
    iconSVG: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>'

  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowWordCount: true
  ShowCodeCopyButtons: true
  ShowShareButtons: true
  ShowRelatedPosts: true
  comments: true
