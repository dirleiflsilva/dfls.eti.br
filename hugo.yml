    Content: "ERP Protheus | Integrações & APIs | Engenharia Dados | PostgreSQL & SQL"
  mainSections: []

  socialIcons:
    - name: linkedin
      url: "https://www.linkedin.com/in/dirleiflsilva/"
    - name: github
      url: "https://github.com/dirleiflsilva"
    - name: gitlab
      url: "https://gitlab.com/dirleiflsilva"

  footer:
    text: "[CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)"

  giscus:
    enable: true
    repo: "dirleiflsilva/dfls.eti.br"
    repoId: "R_kgDORb-qag"
    category: "General"
    categoryId: "DIC_kwDORb-qas4C3so9"
    mapping: "pathname"
    strict: "0"
    reactionsEnabled: "1"
    emitMetadata: "0"
    inputPosition: "top"
    theme: "preferred_color_scheme"
    lang: "pt"

  formspree:
    endpoint: "https://formspree.io/f/mdalqqrv"

