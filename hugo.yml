baseURL: "https://dfls.eti.br/"
languageCode: "pt-br"
defaultContentLanguage: "pt-br"
title: "Dirlei Friedrich"
theme: "PaperMod"
copyright: "Dirlei Friedrich"

enableRobotsTXT: true
pagination:
  pagerSize: 10

minify:
  disableXML: false
  minifyOutput: true

services:
  googleAnalytics:
    id: "G-ZK13WF1R2S"

privacy:
  googleAnalytics:
    disable: false
    respectDoNotTrack: true

params:
